name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Test (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-targets

  clippy:
    name: Clippy lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build --release
        run: cargo build --workspace --release

  conformance:
    name: Conformance vs C++ oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Checkout artop-cpp reference
        uses: actions/checkout@v4
        with:
          repository: hebin123456/artop-cpp
          path: reference/artop-cpp
          fetch-depth: 1
      - name: Build and run C++ oracle (emf-common)
        run: bash tools/conformance/build_oracle.sh reference/artop-cpp/cpp/emf-cpp/emf-common
      - name: Build and run C++ oracle (emf-ecore)
        run: bash tools/conformance/build_ecore_oracle.sh reference/artop-cpp/cpp/emf-cpp/emf-ecore reference/artop-cpp/cpp/emf-cpp/emf-common
      - name: Build and run C++ oracle (emf-edit)
        run: bash tools/conformance/build_edit_oracle.sh reference/artop-cpp/cpp/emf-cpp/emf-edit reference/artop-cpp/cpp/emf-cpp/emf-ecore reference/artop-cpp/cpp/emf-cpp/emf-common reference/artop-cpp/cpp/emf-cpp/emf-ecore-util
      - name: Build and run C++ oracle (emf-acceleo)
        run: bash tools/conformance/build_acceleo_oracle.sh reference/artop-cpp/cpp/emf-cpp/emf-acceleo reference/artop-cpp/cpp/emf-cpp/emf-xcore reference/artop-cpp/cpp/emf-cpp/emf-ecore reference/artop-cpp/cpp/emf-cpp/emf-common
      - name: Build and run C++ oracle (emf-sphinx)
        run: bash tools/conformance/build_sphinx_oracle.sh reference/artop-cpp/cpp/emf-cpp/emf-sphinx reference/artop-cpp/cpp/emf-cpp/emf-xmi reference/artop-cpp/cpp/emf-cpp/emf-edit reference/artop-cpp/cpp/emf-cpp/emf-ecore-util reference/artop-cpp/cpp/emf-cpp/emf-ecore reference/artop-cpp/cpp/emf-cpp/emf-common
      - name: Compare Rust vs oracle (emf-common)
        run: python3 tools/conformance/compare.py --oracle tools/conformance/build/oracle.json --cases tools/conformance/cases.tsv --pkg emf-common
      - name: Compare Rust vs oracle (emf-ecore)
        run: python3 tools/conformance/compare.py --oracle tools/conformance/build/ecore_oracle.json --cases tools/conformance/cases_ecore.tsv --pkg emf-ecore
      - name: Compare Rust vs oracle (emf-edit)
        run: python3 tools/conformance/compare.py --oracle tools/conformance/build/edit_oracle.json --cases tools/conformance/cases_edit.tsv --pkg emf-edit
      - name: Compare Rust vs oracle (emf-acceleo)
        run: python3 tools/conformance/compare.py --oracle tools/conformance/build/acceleo_oracle.json --cases tools/conformance/cases_acceleo.tsv --pkg emf-acceleo
      - name: Compare Rust vs oracle (emf-sphinx)
        run: python3 tools/conformance/compare.py --oracle tools/conformance/build/sphinx_oracle.json --cases tools/conformance/cases_sphinx.tsv --pkg emf-sphinx