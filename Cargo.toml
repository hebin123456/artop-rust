[workspace]
resolver = "2"
members = [
    "crates/artop-common",
    "crates/artop-ecore",
    "crates/artop-metamodel",
    "crates/artop-ecore-util",
    "crates/artop-ecore-codegen",
    "crates/artop-xmi",
    "crates/artop-xsd",
    "crates/artop-edit",
    "crates/artop-compare",
    "crates/artop-validation",
    "crates/artop-xcore",
    "crates/artop-acceleo",
    "crates/artop-sphinx",
    "crates/artop-artop-runtime",
    "crates/artop-artop-codegen",
    "examples/arxml-roundtrip",
    "examples/arxml-validate",
]

[workspace.dependencies]
artop-common = { path = "crates/artop-common" }
artop-ecore = { path = "crates/artop-ecore" }
artop-metamodel = { path = "crates/artop-metamodel" }
artop-ecore-util = { path = "crates/artop-ecore-util" }
artop-ecore-codegen = { path = "crates/artop-ecore-codegen" }
artop-xmi = { path = "crates/artop-xmi" }
artop-xsd = { path = "crates/artop-xsd" }
artop-edit = { path = "crates/artop-edit" }
artop-compare = { path = "crates/artop-compare" }
artop-validation = { path = "crates/artop-validation" }
artop-xcore = { path = "crates/artop-xcore" }
artop-acceleo = { path = "crates/artop-acceleo" }
artop-sphinx = { path = "crates/artop-sphinx" }
artop-artop-runtime = { path = "crates/artop-artop-runtime" }
artop-artop-codegen = { path = "crates/artop-artop-codegen" }

[profile.release]
opt-level = 2